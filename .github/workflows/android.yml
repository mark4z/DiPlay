name: Android checks
on:
  push:
    branches: [main, feature/browser-carplay]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - name: Test authentication helpers with synthetic data only
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser viewer
        run: |
          node --test site/browser-carplay/tests/*.test.mjs
          node --check site/browser-carplay/viewer.mjs
          node --check site/browser-carplay/session.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Pull requests may restore public source caches but never write them.
          cache-read-only: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}
          gradle-home-cache-includes: |
            caches/modules-2
            caches/build-cache-1
            wrapper/dists
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --build-cache --no-configuration-cache --no-scan --stacktrace
      - name: Verify source APK has no bundled identity
        if: ${{ success() }}
        run: python3 scripts/check_source_apk.py mobile/build/outputs/apk/debug/mobile-debug.apk
      - name: Upload credential-free mobile APK directly
        if: ${{ success() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
