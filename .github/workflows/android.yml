name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - name: Verify generic source boundary
        run: python3 scripts/check_generic_boundary.py
      - name: Test validation helpers with synthetic data only
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :generic:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :generic:lintDebug :automotive:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :generic:assembleDebug :automotive:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Verify packaged generic boundary
        run: python3 scripts/check_generic_boundary.py --apk generic/build/outputs/apk/debug/generic-debug.apk --source-only
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            generic/build/reports/tests/
            generic/build/reports/lint-results-debug.html
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
