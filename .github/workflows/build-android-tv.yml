name: Build DiPlay Android TV source APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Pull requests may restore public source caches but never write them.
          cache-read-only: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}
          gradle-home-cache-includes: |
            caches/modules-2
            caches/build-cache-1
            wrapper/dists
      - name: Test, lint and build without authentication assets
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --build-cache --no-configuration-cache --no-scan --stacktrace
      - name: Upload source-only APK directly
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
