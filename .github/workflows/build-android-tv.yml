name: Build DiPlay Android TV source APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - name: Verify generic source boundary
        run: python3 scripts/check_generic_boundary.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build without authentication assets
        run: ./gradlew :shared:testGenericDebugUnitTest :generic:testDebugUnitTest :generic:lintDebug :generic:assembleDebug --stacktrace
      - name: Verify vendor-free, identity-free APK
        run: python3 scripts/check_generic_boundary.py --apk generic/build/outputs/apk/debug/generic-debug.apk --source-only
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Generic-Android-source-only
          path: generic/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
