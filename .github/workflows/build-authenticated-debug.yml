name: Build authenticated debug APK

on:
  # Every manual run publishes an APK containing EXTRACTABLE identity for 1 day.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/browser-carplay')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      cache-key: ${{ steps.source-cache.outputs.cache-primary-key }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Select isolated source cache directory
        run: printf 'GRADLE_USER_HOME=%s/diplay-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject credential files and test helpers with synthetic data
        run: |
          python3 scripts/check_public_tree.py
          python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      # This namespace is written only by this trusted, credential-free job.
      # Keep paths identical in save/restore: Actions includes them in its cache version.
      - name: Restore safe source dependencies and task outputs
        id: source-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
          key: auth-source-original-v1-${{ runner.os }}-${{ runner.arch }}-jdk25-mobile-${{ hashFiles('**/*.gradle*', '**/gradle.properties', 'gradle/**', 'scripts/gradle-readonly-cache.init.gradle') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            auth-source-original-v1-${{ runner.os }}-${{ runner.arch }}-jdk25-mobile-${{ hashFiles('**/*.gradle*', '**/gradle.properties', 'gradle/**', 'scripts/gradle-readonly-cache.init.gradle') }}-${{ github.sha }}-
            auth-source-original-v1-${{ runner.os }}-${{ runner.arch }}-jdk25-mobile-${{ hashFiles('**/*.gradle*', '**/gradle.properties', 'gradle/**', 'scripts/gradle-readonly-cache.init.gradle') }}-
      - name: Source-only unit tests and lint before credentials
        run: |
          unset DIPLAY_AUTH_ASSETS_DIR DIPLAY_MFI_KEY_B64 DIPLAY_MFI_CERT_B64
          ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug --no-daemon --build-cache --no-configuration-cache --no-scan --stacktrace
      # Explicit save, before the credential job can start. No post-job cache hook.
      - name: Save only credential-free source cache
        if: ${{ success() && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/browser-carplay') }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
          key: ${{ steps.source-cache.outputs.cache-primary-key }}

  build:
    needs: source-checks
    if: >-
      github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/browser-carplay')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Select isolated temporary directories
        run: |
          # Fresh hosted runner; only a safe source snapshot is restored below.
          printf 'GRADLE_USER_HOME=%s/diplay-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'AUTH_WORK_DIR=%s/diplay-auth-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'AUTH_APK_DIR=%s/diplay-apk-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - name: Restore this run's safe source snapshot (never save)
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
          # Exact trusted producer key only; no fallback to other jobs, refs or old caches.
          key: ${{ needs.source-checks.outputs.cache-key }}
      - name: Build and verify authenticated APK without credential logs
        env:
          DIPLAY_MFI_KEY_B64: ${{ secrets.DIPLAY_MFI_KEY_B64 }}
          DIPLAY_MFI_CERT_B64: ${{ secrets.DIPLAY_MFI_CERT_B64 }}
        run: |
          set +x
          python3 scripts/build_authenticated_debug.py --work-dir "$AUTH_WORK_DIR" --publish-dir "$AUTH_APK_DIR"
      - name: Upload authenticated APK with extractable identity (1 day)
        if: ${{ success() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: ${{ env.AUTH_APK_DIR }}/DiPlay-standalone-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Remove identity, APK, build intermediates and isolated caches
        if: ${{ always() }}
        run: |
          rm -rf -- "$AUTH_WORK_DIR" "$AUTH_APK_DIR" "$GRADLE_USER_HOME"
          rm -rf -- .gradle .kotlin mobile/build common/build shared/build shared/.cxx
