name: Build authenticated debug APK

on:
  workflow_dispatch:
    inputs:
      publish_apk:
        description: 'Publish APK with EXTRACTABLE identity for public download (1 day)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Select isolated temporary directories
        run: |
          # No Gradle cache action or shared user home in this job.
          printf 'GRADLE_USER_HOME=%s/diplay-gradle-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'AUTH_WORK_DIR=%s/diplay-auth-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'AUTH_APK_DIR=%s/diplay-apk-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject credential files and test helpers with synthetic data
        run: |
          python3 scripts/check_public_tree.py
          python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - name: Source-only unit tests and lint before credentials
        run: |
          unset DIPLAY_AUTH_ASSETS_DIR
          ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug --no-daemon --no-build-cache --no-configuration-cache --no-scan --stacktrace
      - name: Build and verify authenticated APK without credential logs
        env:
          DIPLAY_MFI_KEY_B64: ${{ secrets.DIPLAY_MFI_KEY_B64 }}
          DIPLAY_MFI_CERT_B64: ${{ secrets.DIPLAY_MFI_CERT_B64 }}
          PUBLISH_APK: ${{ inputs.publish_apk }}
        run: |
          set +x
          if [ "$PUBLISH_APK" = 'true' ]; then
            python3 scripts/build_authenticated_debug.py --work-dir "$AUTH_WORK_DIR" --publish-dir "$AUTH_APK_DIR"
          else
            python3 scripts/build_authenticated_debug.py --work-dir "$AUTH_WORK_DIR"
          fi
      - name: Publish extractable-identity APK only by explicit choice
        if: ${{ success() && inputs.publish_apk }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DiPlay-authenticated-debug-${{ github.run_id }}
          path: ${{ env.AUTH_APK_DIR }}/DiPlay-standalone-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Remove identity, APK, build intermediates and isolated caches
        if: ${{ always() }}
        run: |
          rm -rf -- "$AUTH_WORK_DIR" "$AUTH_APK_DIR" "$GRADLE_USER_HOME"
          rm -rf -- .gradle .kotlin mobile/build common/build shared/build shared/.cxx
