name: Request private APK build

on:
  push:
    branches:
      - feature/embedded-https-viewer

permissions: {}

concurrency:
  group: private-apk-dispatch-${{ github.sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/embedded-https-viewer' &&
      github.repository == 'mark4z/DiPlay' &&
      github.repository_id == '1405948725' &&
      github.repository_owner == 'mark4z' &&
      github.repository_owner_id == '36187602' &&
      github.event.repository.private == false &&
      github.actor == 'mark4z' &&
      github.triggering_actor == 'mark4z' &&
      github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send bounded private build request
        shell: bash
        env:
          DIPLAY_PRIVATE_BUILD_TOKEN: ${{ secrets.DIPLAY_PRIVATE_BUILD_TOKEN }}
        run: |
          set +x
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import HTTPRedirectHandler, ProxyHandler, Request, build_opener

          ENDPOINT = "https://api.github.com/repos/mark4z/DiPlay-private-build/actions/workflows/private-apk.yml/dispatches"
          SOURCE_REF = "refs/heads/feature/embedded-https-viewer"

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def trusted_push(environment, event):
              if not isinstance(event, dict):
                  return False
              repository = event.get("repository")
              if not isinstance(repository, dict):
                  return False
              owner = repository.get("owner")
              if not isinstance(owner, dict):
                  return False
              sha = environment.get("GITHUB_SHA", "")
              return (
                  environment.get("GITHUB_EVENT_NAME") == "push"
                  and environment.get("GITHUB_REF") == SOURCE_REF
                  and environment.get("GITHUB_REPOSITORY") == "mark4z/DiPlay"
                  and environment.get("GITHUB_REPOSITORY_ID") == "1405948725"
                  and environment.get("GITHUB_REPOSITORY_OWNER") == "mark4z"
                  and environment.get("GITHUB_REPOSITORY_OWNER_ID") == "36187602"
                  and environment.get("GITHUB_ACTOR") == "mark4z"
                  and environment.get("GITHUB_TRIGGERING_ACTOR") == "mark4z"
                  and repository.get("full_name") == "mark4z/DiPlay"
                  and repository.get("id") == 1405948725
                  and repository.get("private") is False
                  and owner.get("login") == "mark4z"
                  and owner.get("id") == 36187602
                  and event.get("deleted") is False
                  and event.get("ref") == SOURCE_REF
                  and re.fullmatch(r"[0-9a-f]{40}", sha) is not None
                  and sha != "0" * 40
                  and event.get("after") == sha
              )

          def main():
              try:
                  event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
                  if not trusted_push(os.environ, event):
                      print("::notice::Private build request skipped: untrusted push context.")
                      return 0
              except Exception:
                  print("::error::Private build request stopped: push context could not be verified.")
                  return 1

              token = os.environ.get("DIPLAY_PRIVATE_BUILD_TOKEN", "")
              if not token.strip():
                  print("::warning::Repository owner must configure the DIPLAY_PRIVATE_BUILD_TOKEN Actions secret before private builds can be requested.")
                  print("Private build request skipped: nothing was dispatched.")
                  return 0
              try:
                  request = Request(
                      ENDPOINT,
                      data=json.dumps({"ref": "main", "inputs": {"source_sha": os.environ["GITHUB_SHA"]}}).encode("utf-8"),
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": "Bearer " + token,
                          "Content-Type": "application/json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                      method="POST",
                  )
                  # No checkout, untrusted source, proxy, redirect or automatic retry.
                  opener = build_opener(ProxyHandler({}), NoRedirect())
                  with opener.open(request, timeout=20) as response:
                      # Never read or log private response bodies, URLs or run IDs.
                      accepted = response.status in (200, 204)
                  if not accepted:
                      print("::error::Private build request was not confirmed; no automatic retry was attempted.")
                      return 1
              except Exception:
                  # Even exception messages may contain the token or private metadata.
                  print("::error::Private build request was not confirmed; no automatic retry was attempted.")
                  return 1
              print("Private build request accepted.")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
